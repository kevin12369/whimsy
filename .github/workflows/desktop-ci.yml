name: desktop-ci
on:
  pull_request:
    paths: ['apps/desktop/**', '.github/workflows/desktop-ci.yml']
  push:
    branches: [main]
    paths: ['apps/desktop/**']
jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v6
        with: { node-version: 20.18.0, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Type check Rust
        run: cd apps/desktop/src-tauri && cargo check --release
      - name: Build frontend
        run: cd apps/desktop && pnpm build
