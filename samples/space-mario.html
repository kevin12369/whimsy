<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Space Mario</title>
<style>body{margin:0;background:#000;color:#fff;font-family:sans-serif}canvas{display:block;margin:auto}</style>
</head><body>
<canvas id="g" width="800" height="600"></canvas>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script>
new Phaser.Game({type:Phaser.AUTO,parent:'g',width:800,height:600,
  physics:{default:'arcade',arcade:{gravity:{y:800}}},
  scene:{create(){
    this.add.rectangle(400,580,800,40,0x444444);
    const p=this.physics.add.rectangle(100,500,32,32,0x3aa6ff);
    const c=this.input.keyboard.createCursorKeys();
    this.add.text(16,16,'Score: 0',{fontSize:'20px',fill:'#fff'});
    this.input.keyboard.on('keydown-R',()=>location.reload());
    this.physics.add.collider(p,this.add.rectangle(400,580,800,40,0x444444));
    this.input.keyboard.on('keydown',()=>{});
  }}});
</script></body></html>
